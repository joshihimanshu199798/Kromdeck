name: Build & Publish Kromdeck APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APK to GitHub Releases"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Release APK (when keystore secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
            gradle :app:assembleRelease --no-daemon
          else
            echo "Release signing secrets not configured; publishing Debug APK only."
          fi

      - name: Stage APK files for publishing
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/kromdeck-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/kromdeck-release.apk
          fi
          ls -lh dist/

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kromdeck-latest-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish latest APK to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'push' || inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Kromdeck {0}', github.ref_name) || 'Kromdeck Latest APK' }}
          body: |
            Automated APK build for **Kromdeck** (`com.aistudio.kromdeck.kxmpzq`).
            - Commit: `${{ github.sha }}`
            - Branch/Ref: `${{ github.ref_name }}`
            - Includes `kromdeck-debug.apk` (and `kromdeck-release.apk` when signing secrets are configured).
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          files: |
            dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
