name: Build & Publish Kromdeck Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave blank to auto-generate v1.0.<run_number>)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Prepare debug keystore for unit tests
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Prepare Release Keystore & Build Signed Release APK
        id: build_release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using repository signing secrets for release APK..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
            export STORE_PASSWORD="$SECRET_STORE_PASSWORD"
            export KEY_PASSWORD="$SECRET_KEY_PASSWORD"
            echo "signing_mode=Repository Upload Keystore" >> "$GITHUB_OUTPUT"
          else
            echo "Repository signing secrets not set; generating CI release signing keystore..."
            CI_PASS="kromdeck-ci-release-key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$CI_PASS" \
              -keypass "$CI_PASS" \
              -dname "CN=Kromdeck Release,O=Kromdeck,C=US"
            export STORE_PASSWORD="$CI_PASS"
            export KEY_PASSWORD="$CI_PASS"
            echo "signing_mode=Auto-Generated CI Release Keystore" >> "$GITHUB_OUTPUT"
          fi

          gradle :app:assembleRelease --no-daemon

      - name: Resolve Release Tag & Stage Release APK
        id: stage
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/kromdeck-${TAG}-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/kromdeck-release.apk"
          ls -lh dist/

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kromdeck-release-apk-${{ steps.stage.outputs.release_tag }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.release_tag }}
          name: Kromdeck ${{ steps.stage.outputs.release_tag }} (Release APK)
          body: |
            Official **Release APK** build for **Kromdeck** (`com.aistudio.kromdeck.kxmpzq`).

            - **Tag:** `${{ steps.stage.outputs.release_tag }}`
            - **Commit:** `${{ github.sha }}`
            - **Signing:** ${{ steps.build_release.outputs.signing_mode }}
            - **Downloads:**
              - `kromdeck-release.apk` (stable latest filename)
              - `kromdeck-${{ steps.stage.outputs.release_tag }}-release.apk` (versioned filename)
          prerelease: false
          make_latest: true
          files: |
            dist/kromdeck-release.apk
            dist/kromdeck-${{ steps.stage.outputs.release_tag }}-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
